<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LittleSeed Plants - Prototipe</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=DM+Sans:wght@400;500&display=swap">
<style>
:root{--bg:#f8faf4;--card:#fff;--ink:#1d2b20;--mute:#5d6b60;--line:#dde5d6;--g:#2f5d3a;--gl:#e3efd9;--sun:#f0c04a;--r:12px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141c16;--card:#1c2620;--ink:#e8efe6;--mute:#9fb0a2;--line:#2c3a30;--g:#7fc08a;--gl:#243a2a}}
:root[data-theme="dark"]{--bg:#141c16;--card:#1c2620;--ink:#e8efe6;--mute:#9fb0a2;--line:#2c3a30;--g:#7fc08a;--gl:#243a2a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "DM Sans",system-ui,sans-serif}
h1,h2,h3,.logo{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;margin:0;letter-spacing:-.01em}
button{font:inherit;cursor:pointer;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1080px;margin:auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.logo{font-size:20px;color:var(--g);cursor:pointer;border:0;background:none;padding:0}
.sw{position:relative;flex:1;min-width:180px}
.sw input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);color:var(--ink);font:inherit}
.sug{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;z-index:6}
.sug button{display:block;width:100%;text-align:left;padding:8px 12px;border:0;background:none}
.sug button:hover{background:var(--gl)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{border:0;background:none;padding:6px 10px;border-radius:20px;color:var(--mute)}
nav button:hover,nav button.on{background:var(--gl);color:var(--g)}
.cart{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:8px 12px}
main{max-width:1080px;margin:auto;padding:20px 16px 48px}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center;background:var(--gl);border-radius:20px;padding:32px}
.hero h1{font-size:clamp(28px,5vw,44px);line-height:1.1;margin-bottom:12px}
.hero p{color:var(--mute);margin:0 0 20px;max-width:46ch}
.btn{background:var(--g);color:var(--bg);border:0;border-radius:var(--r);padding:10px 18px;font-weight:500}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
h2{font-size:22px;margin:32px 0 14px}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.cat{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:2px}
.cat:hover{border-color:var(--g)}
.cat small{color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column}
.card:hover{border-color:var(--g)}
.card svg{display:block;width:100%;height:auto}
.cb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px}
.cb b{font-weight:500}
.pr{color:var(--g);font-weight:500}
.bd{display:flex;flex-wrap:wrap;gap:5px}
.b{font-size:12px;background:var(--gl);color:var(--g);border-radius:20px;padding:2px 9px;white-space:nowrap}
.cw{display:grid;grid-template-columns:210px 1fr;gap:20px;align-items:start}
.fs{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.fs h3{font-size:15px}
.fs label{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.fg{display:flex;flex-direction:column;gap:6px}
.tb{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:0;background:var(--g);color:var(--bg);border-radius:20px;padding:3px 10px;font-size:13px}
select{padding:7px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);color:var(--ink);font:inherit}
input[type=range]{width:100%;accent-color:var(--g)}
.ftog{display:none}
.dt{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
.dt svg{width:100%;height:auto;border-radius:20px}
.dt h1{font-size:30px;margin:6px 0}
.qi{background:var(--gl);border-radius:var(--r);padding:12px 14px;margin:14px 0}
.ac{border-top:1px solid var(--line)}
.ac button{width:100%;display:flex;justify-content:space-between;background:none;border:0;padding:12px 0;font-weight:500}
.ac div{display:none;padding:0 0 12px;color:var(--mute)}
.ac.open div{display:block}
.ac.open span{transform:rotate(180deg)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.qty button{border:0;background:var(--card);padding:8px 12px}
.qty span{min-width:30px;text-align:center}
.crumb{color:var(--mute);font-size:13px;margin-bottom:14px}
.crumb button{border:0;background:none;padding:0;color:var(--g);text-decoration:underline}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:32px;text-align:center;color:var(--mute)}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:var(--r);z-index:9}
@media(max-width:760px){.hero,.dt,.cw{grid-template-columns:1fr}.hero{padding:22px}.ftog{display:inline-block}.fs.shut{display:none}}
</style>
</head>
<body>
<header><div class="bar">
<button class="logo" onclick="go('home')">LittleSeed Plants</button>
<div class="sw"><input id="q" type="search" placeholder="Cari tanaman, mis. lidah mertua" autocomplete="off" aria-label="Cari tanaman"><div class="sug" id="sug" hidden></div></div>
<nav id="nav"></nav>
<button class="cart" onclick="toast('Keranjang hanya contoh di prototipe ini')">Keranjang (<span id="cn">0</span>)</button>
</div></header>
<main id="app"></main>
<script>
var P=[
[1,"Monstera deliciosa","Indoor","Besar","Sedang","Sedang",0,185000,128,"Daun lebar berlubang yang jadi pusat perhatian ruang tamu.","Siram saat 3 cm tanah atas kering. Taruh dekat jendela dengan cahaya tersaring."],
[2,"Lidah mertua","Indoor","Sedang","Rendah","Mudah",0,65000,150,"Tahan banting dan cocok untuk pemula atau ruangan redup.","Siram 2 minggu sekali. Hindari tanah yang selalu basah."],
[3,"Calathea orbifolia","Indoor","Sedang","Sedang","Sulit",1,120000,140,"Daun bergaris perak yang bergerak mengikuti cahaya.","Butuh kelembapan tinggi. Gunakan air bebas kaporit dan jauhkan dari AC."],
[4,"Peperomia","Indoor","Kecil","Sedang","Mudah",1,45000,120,"Mungil, rapi, dan aman untuk meja kerja.","Siram seminggu sekali. Cahaya terang tidak langsung."],
[5,"Pakis Boston","Indoor","Sedang","Sedang","Sedang",1,55000,110,"Rimbun dan segar, cocok digantung di teras teduh.","Jaga tanah tetap lembap dan semprot daunnya tiap beberapa hari."],
[6,"Aloe vera","Sukulen","Kecil","Terang","Mudah",0,35000,100,"Gel daunnya bisa dipakai untuk perawatan kulit ringan.","Siram saat tanah benar-benar kering. Butuh banyak sinar matahari."],
[7,"Echeveria","Sukulen","Kecil","Terang","Mudah",1,40000,165,"Roset berbentuk bunga yang rapi dan tahan kering.","Siram 10 hari sekali. Pakai pot dengan lubang drainase."],
[8,"Haworthia","Sukulen","Kecil","Sedang","Mudah",1,38000,135,"Sukulen kecil yang tetap tumbuh di cahaya sedang.","Siram 2 minggu sekali. Jangan biarkan air menggenang di roset."],
[9,"Bougainvillea","Outdoor","Besar","Terang","Sedang",1,90000,330,"Semak berbunga warna-warni untuk pagar atau halaman.","Siram rutin, lalu kurangi saat berbunga. Perlu sinar matahari penuh."],
[10,"Mawar mini","Bunga","Kecil","Terang","Sedang",1,60000,350,"Bunga mungil yang cocok untuk balkon kecil.","Siram pagi hari dan pangkas bunga layu agar cepat berbunga lagi."],
[11,"Anggrek bulan","Bunga","Sedang","Sedang","Sulit",1,150000,300,"Bunga elegan yang tahan berminggu-minggu.","Siram dengan merendam akar sebentar tiap 5-7 hari."],
[12,"Lavender","Bunga","Sedang","Terang","Sedang",0,75000,265,"Harum menenangkan dan menarik lebah ke halaman.","Butuh tanah berpasir dan sinar matahari penuh. Jangan terlalu sering disiram."]
].map(function(a){return{id:a[0],n:a[1],cat:a[2],size:a[3],light:a[4],care:a[5],pet:a[6],price:a[7],h:a[8],d:a[9],t:a[10]}});
var CATS=["Indoor","Outdoor","Sukulen","Bunga"];
var S={v:"home",id:0,f:{cat:[],size:[],light:[],care:[],pet:false,max:200000},sort:"pop",shut:true,cart:0,qty:1};
var $=function(i){return document.getElementById(i)};
var rp=function(n){return "Rp "+n.toLocaleString("id-ID")};
function art(p,small){var c="hsl("+p.h+",45%,38%)",c2="hsl("+p.h+",50%,52%)",L="";
if(p.cat=="Sukulen"){for(var i=0;i<8;i++)L+='<ellipse cx="100" cy="92" rx="9" ry="26" fill="'+(i%2?c:c2)+'" transform="rotate('+i*45+' 100 118) translate(0 -14)"/>'}
else if(p.cat=="Bunga"){for(var i=0;i<5;i++){var x=60+i*20;L+='<path d="M'+x+' 140 Q'+(x+6)+' 100 '+x+' '+(70+i%2*14)+'" stroke="'+c+'" stroke-width="3" fill="none"/><circle cx="'+x+'" cy="'+(70+i%2*14)+'" r="11" fill="hsl('+p.h+',65%,62%)"/><circle cx="'+x+'" cy="'+(70+i%2*14)+'" r="4" fill="#f0c04a"/>'}}
else if(p.cat=="Outdoor"){for(var i=0;i<9;i++)L+='<circle cx="'+(62+i%3*38)+'" cy="'+(70+Math.floor(i/3)*24)+'" r="22" fill="'+(i%2?c:c2)+'"/>';L+='<circle cx="80" cy="64" r="8" fill="hsl('+p.h+',70%,60%)"/><circle cx="128" cy="92" r="8" fill="hsl('+p.h+',70%,60%)"/>'}
else{for(var i=0;i<7;i++){var a=-60+i*20;L+='<ellipse cx="100" cy="86" rx="'+(p.size=="Kecil"?12:17)+'" ry="'+(p.size=="Kecil"?34:44)+'" fill="'+(i%2?c:c2)+'" transform="rotate('+a+' 100 140) translate(0 -8)"/>'}}
return '<svg viewBox="0 0 200 200" role="img" aria-label="Ilustrasi '+p.n+'"><rect width="200" height="200" fill="hsl('+p.h+',40%,92%)"/>'+L+'<path d="M72 138h56l-7 46H79z" fill="#b8754f"/><rect x="68" y="132" width="64" height="10" rx="3" fill="#a3643f"/></svg>'}
function badges(p){return '<div class="bd"><span class="b">Cahaya '+p.light.toLowerCase()+'</span><span class="b">Perawatan '+p.care.toLowerCase()+'</span><span class="b">'+p.size+'</span>'+(p.pet?'<span class="b">Aman hewan</span>':'')+'</div>'}
function cardH(p){return '<button class="card" onclick="go(\'detail\','+p.id+')">'+art(p)+'<div class="cb"><b>'+p.n+'</b><span class="pr">'+rp(p.price)+'</span>'+badges(p)+'</div></button>'}
function go(v,id){S.v=v;S.id=id||0;S.qty=1;scrollTo(0,0);render()}
function openCat(c){S.f={cat:[c],size:[],light:[],care:[],pet:false,max:200000};go('cat')}
function tog(k,v){var a=S.f[k],i=a.indexOf(v);i<0?a.push(v):a.splice(i,1);render()}
function list(){var f=S.f,q=$("q").value.trim().toLowerCase();
var r=P.filter(function(p){return(!f.cat.length||f.cat.indexOf(p.cat)>-1)&&(!f.size.length||f.size.indexOf(p.size)>-1)&&(!f.light.length||f.light.indexOf(p.light)>-1)&&(!f.care.length||f.care.indexOf(p.care)>-1)&&(!f.pet||p.pet)&&p.price<=f.max&&(!q||p.n.toLowerCase().indexOf(q)>-1)});
if(S.sort=="lo")r.sort(function(a,b){return a.price-b.price});else if(S.sort=="hi")r.sort(function(a,b){return b.price-a.price});else if(S.sort=="new")r.sort(function(a,b){return b.id-a.id});
return r}
function grp(t,k,o){return '<div class="fg"><h3>'+t+'</h3>'+o.map(function(x){return '<label><input type="checkbox" '+(S.f[k].indexOf(x)>-1?'checked':'')+' onchange="tog(\''+k+'\',\''+x+'\')">'+x+'</label>'}).join('')+'</div>'}
function view(){var h="";
if(S.v=="home"){h='<section class="hero"><div><h1>Temukan tanaman yang cocok untuk ruangmu</h1><p>Filter berdasarkan cahaya, ukuran, dan tingkat perawatan. Tidak perlu tebak-tebakan lagi.</p><button class="btn" onclick="go(\'cat\')">Lihat semua tanaman</button> <button class="btn alt" onclick="openCat(\'Indoor\')">Tanaman indoor</button></div>'+art(P[0])+'</section><h2>Belanja per kategori</h2><div class="cats">'+CATS.map(function(c){return '<button class="cat" onclick="openCat(\''+c+'\')"><b>'+c+'</b><small>'+P.filter(function(p){return p.cat==c}).length+' tanaman</small></button>'}).join('')+'</div><h2>Rekomendasi untukmu</h2><div class="grid">'+[1,5,6,10].map(function(i){return cardH(P[i])}).join('')+'</div>'}
else if(S.v=="cat"){var r=list(),f=S.f,ch="";
["cat","size","light","care"].forEach(function(k){f[k].forEach(function(v){ch+='<button class="chip" onclick="tog(\''+k+'\',\''+v+'\')">'+v+' x</button>'})});
if(f.pet)ch+='<button class="chip" onclick="S.f.pet=false;render()">Aman hewan x</button>';
if(f.max<200000)ch+='<button class="chip" onclick="S.f.max=200000;render()">Maks '+rp(f.max)+' x</button>';
h='<div class="crumb"><button onclick="go(\'home\')">Home</button> / Katalog</div><div class="cw"><aside><button class="btn alt ftog" style="width:100%;margin-bottom:10px" onclick="S.shut=!S.shut;render()">'+(S.shut?'Tampilkan filter':'Sembunyikan filter')+'</button><div class="fs'+(S.shut?' shut':'')+'">'+grp("Kategori","cat",CATS)+grp("Ukuran","size",["Kecil","Sedang","Besar"])+grp("Kebutuhan cahaya","light",["Rendah","Sedang","Terang"])+grp("Tingkat perawatan","care",["Mudah","Sedang","Sulit"])+'<div class="fg"><label><input type="checkbox" '+(f.pet?'checked':'')+' onchange="S.f.pet=this.checked;render()">Aman untuk hewan</label></div><div class="fg"><h3>Harga maks: '+rp(f.max)+'</h3><input type="range" min="30000" max="200000" step="5000" value="'+f.max+'" aria-label="Harga maksimum" oninput="S.f.max=+this.value;render()"></div><button class="btn alt" onclick="S.f={cat:[],size:[],light:[],care:[],pet:false,max:200000};$(\'q\').value=\'\';render()">Reset filter</button></div></aside><section><div class="tb"><div class="chips">'+(ch||'<span style="color:var(--mute)">Belum ada filter aktif</span>')+'</div><label>Urutkan <select onchange="S.sort=this.value;render()">'+[["pop","Terlaris"],["lo","Harga termurah"],["hi","Harga termahal"],["new","Terbaru"]].map(function(o){return '<option value="'+o[0]+'"'+(S.sort==o[0]?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select></label></div><p style="color:var(--mute);margin:0 0 12px">'+r.length+' tanaman ditemukan</p>'+(r.length?'<div class="grid">'+r.map(cardH).join('')+'</div>':'<div class="empty"><b>Tidak ada tanaman yang cocok</b><br>Longgarkan satu filter atau reset untuk mulai lagi.</div>')+'</section></div>'}
else{var p=P[S.id-1],sim=P.filter(function(x){return x.cat==p.cat&&x.id!=p.id}).slice(0,3);
var ac=function(t,b,o){return '<div class="ac'+(o?' open':'')+'"><button onclick="this.parentNode.classList.toggle(\'open\')" aria-expanded="'+!!o+'">'+t+'<span>v</span></button><div>'+b+'</div></div>'};
h='<div class="crumb"><button onclick="go(\'home\')">Home</button> / <button onclick="openCat(\''+p.cat+'\')">'+p.cat+'</button> / '+p.n+'</div><div class="dt">'+art(p)+'<div><h1>'+p.n+'</h1><div class="pr" style="font-size:20px">'+rp(p.price)+'</div><div style="margin-top:10px">'+badges(p)+'</div><div class="qi"><b>Ringkasan perawatan</b><br>'+p.t+'</div><div style="display:flex;gap:10px;align-items:center;margin-bottom:18px"><div class="qty"><button onclick="S.qty=Math.max(1,S.qty-1);render()" aria-label="Kurangi">-</button><span>'+S.qty+'</span><button onclick="S.qty++;render()" aria-label="Tambah">+</button></div><button class="btn" style="flex:1" onclick="S.cart+=S.qty;toast(S.qty+\' x '+p.n+' masuk keranjang\');render()">Tambah ke keranjang</button></div>'+ac("Deskripsi",p.d,1)+ac("Cara merawat",p.t,0)+ac("Ulasan","4,8 dari 5 (contoh ulasan: 'Tanaman datang segar dan terbungkus rapi.')",0)+'</div></div><h2>Tanaman serupa</h2><div class="grid">'+sim.map(cardH).join('')+'</div>'}
return h}
function render(){$("app").innerHTML=view();$("cn").textContent=S.cart;
$("nav").innerHTML=CATS.map(function(c){return '<button class="'+(S.v=="cat"&&S.f.cat[0]==c&&S.f.cat.length==1?'on':'')+'" onclick="openCat(\''+c+'\')">'+c+'</button>'}).join('')}
var tt;function toast(m){clearTimeout(tt);var o=document.querySelector(".toast");o&&o.remove();var d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);tt=setTimeout(function(){d.remove()},2200)}
$("q").addEventListener("input",function(){var v=this.value.trim().toLowerCase(),s=$("sug");
if(!v){s.hidden=true;if(S.v=="cat")render();return}
var m=P.filter(function(p){return p.n.toLowerCase().indexOf(v)>-1}).slice(0,4);
s.innerHTML=m.length?m.map(function(p){return '<button onclick="$(\'sug\').hidden=true;go(\'detail\','+p.id+')">'+p.n+'</button>'}).join(''):'<button disabled>Tidak ada saran</button>';s.hidden=false;if(S.v=="cat")render()});
$("q").addEventListener("keydown",function(e){if(e.key=="Enter"){$("sug").hidden=true;go("cat")}});
document.addEventListener("click",function(e){if(!e.target.closest(".sw"))$("sug").hidden=true});
render();
</script>
</body>
</html>
